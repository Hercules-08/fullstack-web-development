        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="../programação-web-projeto2/media/logo-LP.png" alt="Linkin Park" height="40">
                    Linkin Park
                </a>
                
                <button class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
                </button>
                
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">

                    </li>
                </ul>
            </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="contactos" class="container py-5">
            <h1 class="text-center text-white mb-4">Contactos</h1>
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <form id="contactForm" class="text-white">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" name="nome" id="nome" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apelido</label>
                            <input type="text" name="apelido" id="apelido" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Data de nascimento</label>
                            <input type="date" name="data" id="data" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Telefone</label>
                            <input type="tel" name="telefone" id="telefone" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mensagem</label>
                            <textarea name="mensagem" id="mensagem" class="form-control" rows="4" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-secondary w-100">Enviar</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>Acesse nossas rede sociais</p>
            <a href="contactos.html">Para saber mais entre em contactos</a>
