<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sua lista de tarefas personalizada">
    <meta name="keywords" content="Tarefas, Listas, Afazeres">
    <meta name="author" content="Jhamison Rodrigues">
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <main>

        <h1>To-do List</h1>

        <ul id="listaTarefas"></ul>
