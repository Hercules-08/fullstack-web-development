<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Loja online de merchandise da banda Linkin Park.">
    <meta name="author" content="Jhamison Rodrigues">
    <title>Linkin Park | Loja Online</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">

                <a class="navbar-brand" href="index.html">
                    <img src="media/logo-LP.png"
                         alt="Logótipo dos Linkin Park"
                         height="40">
                    Linkin Park
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav"
                        aria-controls="navbarNav"
                        aria-expanded="false"
                        aria-label="Abrir menu de navegação">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="sobre.html">Sobre</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="tour.html">Tour</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="albuns.html">Álbuns</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active"
                               href="loja.html"
                               aria-current="page">Loja</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contactos.html">Contactos</a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <section class="text-center mb-5">
            <h1>Loja Oficial de Fãs - Linkin Park</h1>
            <p>Descobre álbum e merchandise da banda.</p>
        </section>

        <section class="mb-4" aria-labelledby="titulo-filtro">

            <h2 id="titulo-filtro">Filtrar produtos</h2>

            <label for="category-filter" class="form-label">
                Escolhe uma categoria:
            </label>

            <select id="category-filter" class="form-select">
                <option value="">Todas as categorias</option>
            </select>

        </section>

        <p id="loading-message" role="status">
            A carregar produtos...
        </p>

        <section id="product-list" class="row g-4" aria-label="Lista de produtos">

        </section>

        <section id="order-form" class="my-5">

            <h2>Calcular valor total</h2>

            <form id="calc-form">

                <div class="mb-3">
                    <label for="product" class="form-label">
                        Escolhe um produto:
                    </label>

                    <select name="product" id="product" class="form-select" required>
                        <option value="">Seleciona um produto</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="quantity" class="form-label">
                        Quantidade:
                    </label>

                    <input type="number" name="quantity" id="quantity" class="form-control" min="1" step="1" value="1" required>
                </div>

                <button type="submit" id="calculate" class="btn btn-dark">
                    Calcular valor
                </button>
            
            </form>

            <div id="total-value" class="mt-3" role="status" aria-live="polite">

            </div>

        </section>

    </main>

    <div id="lightbox"
     class="lightbox"
     role="dialog"
     aria-modal="true"
     aria-labelledby="lightbox-title"
     hidden>

    <div class="lightbox-content">

        <button type="button"
                class="close-btn"
                id="close-lightbox"
                aria-label="Fechar detalhes">
            &times;
        </button>

        <h2 id="lightbox-title"></h2>

        <img id="lightbox-image"
             src=""
             alt=""
             class="img-fluid">

        <p id="lightbox-description"></p>

        <p id="lightbox-price"></p>

    </div>
</div>

    <footer class="text-center py-4">
        <p>&copy; 2026 Fan Site Linkin Park</p>
        <a href="contactos.html">Contactos</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/loja.js" defer></script>

</body>
</html>
