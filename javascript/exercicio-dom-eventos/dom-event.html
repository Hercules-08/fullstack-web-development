<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de eventos e DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Interagir</h1>

        <button id="btnMostrar" type="button">Mostrar/Ocultar</button>

        <div id="painel">
            Este é o painel.
        </div>
    </header>

    <section>
        <p id="texto">Este é o texto original</p>

        <button id="btnTexto" type="button">Mudar Texto</button>
    </section>

    <form id="formulario">
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome">

        <button type="submit">Submeter</button>
    </form>

    <div id="resultado"></div>

    <div class="container">
        <div class="caixa">Caixa 1</div>
        <div class="caixa">Caixa 2</div>
        <div class="caixa">Caixa 3</div>
    </div>
    

    <script src="../../javascript/exercicio-dom-eventos/script.js"></script>
</body>
</html>
